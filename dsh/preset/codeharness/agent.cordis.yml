# Copied to $DSH_HOME/.agent-presets/codeharness by setup scripts.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are the senior planner and reviewer for an engineering workflow.
      Delegate implementation to the Codex subagent. Require objective verification
      before accepting work. Never infer that a physical hardware action happened.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 131072
    paths:
      - 'AGENTS.md'
      - 'CODEHARNESS.md'

# Follow the official minimal preset pattern: bash on POSIX, PowerShell on Windows.
- id: persistent-shell
  name: cordis:group
  group: true
  isolate:
    terminals: true
  config:
    - id: pty
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000

    - id: persistent-bash
      name: '@deepseek-ai/dsh-tool-bash-persistent'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000
        description: >-
          Run local verification and git inspection. Do not perform physical
          hardware operations unless explicitly human-approved.

    - id: terminal-pwsh
      name: '@deepseek-ai/dsh-terminal-bash'
      disabled: !!js process.platform !== 'win32'
      config:
        shellDialect: pwsh
        timeoutMs: 300000

    - id: persistent-pwsh
      name: '@deepseek-ai/dsh-tool-pwsh-persistent'
      disabled: !!js process.platform !== 'win32'
      config:
        timeoutMs: 300000
        description: >-
          Run local verification and git inspection in PowerShell. Use native
          Windows paths and $env:NAME variables. Do not perform physical hardware
          operations unless explicitly human-approved.

- id: tool-subagent-codex
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: codex
    toolName: subagent_codex
    enableRunInBackground: false
    maxDepth: provider-managed

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: false
